name: Publish and verify GENESIS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publication.yml'
      - 'scripts/render-publication.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: genesis-publication
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test unchanged engine and rebuild the standalone demo
        run: |
          node test_genesis.js
          node examples/compare-memory.cjs
          node build_demo.cjs
          node --check genesis_engine.js
          node --check genesis_app_en.js
          mkdir -p evidence
          cp test_results.json evidence/test_results.json
      - name: Prepare browser capture without operating-system package upgrades
        timeout-minutes: 4
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.63.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'GENESIS_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
            npx playwright install ffmpeg
          else
            npx playwright install chromium
          fi
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "GENESIS_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          else
            python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/genesis-ffmpeg" imageio-ffmpeg==0.6.0
            export PYTHONPATH="$RUNNER_TEMP/genesis-ffmpeg"
            echo "GENESIS_FFMPEG=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
          fi
      - name: Record working English and Russian demos and verify mobile layout
        timeout-minutes: 4
        run: node scripts/render-publication.cjs
      - name: Publish verified media and test evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets evidence index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified GENESIS screenshots, recordings and test evidence'
            git push origin HEAD:main
          fi
